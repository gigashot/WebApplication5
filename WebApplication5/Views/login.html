<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncryptApp - Login</title>
    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="/Styles/auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">&#128274;</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your encrypted messaging account</p>

        <div id="alert" class="alert alert-error hidden"></div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        </form>

        <div id="keyWarning" class="alert alert-warning hidden" style="margin-top: 16px;">
            No encryption key found for this browser. You can only decrypt messages on the browser where you registered.
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/Views/register.html">Create one</a>
        </div>
    </div>

    <script src="/Scripts/shared/utils.js"></script>
    <script src="/Scripts/shared/api.js"></script>
    <script src="/Scripts/app/keystore.js"></script>
    <script src="/Scripts/app/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            Auth.initLogin();
        });
    </script>
</body>
</html>
