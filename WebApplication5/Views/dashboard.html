<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncryptApp - Dashboard</title>
    <link rel="stylesheet" href="/Styles/main.css">
</head>
<body>
    <nav class="nav">
        <a href="/Views/dashboard.html" class="nav-brand">EncryptApp</a>
        <ul class="nav-links">
            <li><a href="/Views/chat.html" class="active">Chat</a></li>
            <li><a href="/Views/friends.html">Friends <span id="requestBadge" class="badge hidden">0</span></a></li>
            <li><a href="/Views/search.html">Find Users</a></li>
            <li><a href="/Views/profile.html">Profile</a></li>
        </ul>
        <div class="nav-user">
            <span class="nav-username" id="navUsername"></span>
            <button class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
            <a href="/Views/chat.html" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">&#128172;</div>
                    <h3 style="margin-bottom: 8px;">Messages</h3>
                    <p style="color: var(--gray-500); font-size: 14px;">Send and receive encrypted messages</p>
                </div>
            </a>

            <a href="/Views/friends.html" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">&#128101;</div>
                    <h3 style="margin-bottom: 8px;">Friends</h3>
                    <p style="color: var(--gray-500); font-size: 14px;">Manage your friends and requests</p>
                </div>
            </a>

            <a href="/Views/search.html" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">&#128269;</div>
                    <h3 style="margin-bottom: 8px;">Find Users</h3>
                    <p style="color: var(--gray-500); font-size: 14px;">Search for people to connect with</p>
                </div>
            </a>

            <a href="/Views/profile.html" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-body" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">&#128100;</div>
                    <h3 style="margin-bottom: 8px;">Profile</h3>
                    <p style="color: var(--gray-500); font-size: 14px;">View your account information</p>
                </div>
            </a>
        </div>
    </div>

    <script src="/Scripts/shared/utils.js"></script>
    <script src="/Scripts/shared/api.js"></script>
    <script src="/Scripts/app/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            Dashboard.init();
        });
    </script>
</body>
</html>
