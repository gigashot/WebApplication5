<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncryptApp - Find Users</title>
    <link rel="stylesheet" href="/Styles/main.css">
</head>
<body>
    <nav class="nav">

        });
